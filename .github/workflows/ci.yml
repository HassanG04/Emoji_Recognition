name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt ruff
      - run: ruff check tweet_emotion_django_app/predictor tweet_emotion_django_app/tweet_emotion_site
      - run: ruff format --check tweet_emotion_django_app/predictor tweet_emotion_django_app/tweet_emotion_site
      - working-directory: tweet_emotion_django_app
        run: python manage.py check && python manage.py test predictor
